<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #0a0a0a;
            border-radius: 0;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2em;
            font-weight: 300;
            letter-spacing: -1px;
        }

        .info-card {
            background: transparent;
            border-radius: 0;
            padding: 20px 0;
            margin-bottom: 30px;
            transition: border-color 0.2s ease;
            border-bottom: 1px solid #333333;
            cursor: pointer;
            position: relative;
            opacity: 0;
            transform: translateY(20px);
        }

        .info-card:hover {
            border-bottom-color: #ffffff;
        }

        .info-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .info-label {
            font-size: 0.85em;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 400;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .info-value {
            font-size: 1.3em;
            color: #ffffff;
            font-weight: 300;
            position: relative;
            z-index: 1;
        }

        .cgpa {
            color: #ffffff;
        }

        .copy-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ffffff;
            color: #000000;
            padding: 12px 20px;
            border-radius: 0;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
            z-index: 1000;
            pointer-events: none;
            font-size: 0.9em;
            font-weight: 300;
        }

        .copy-notification.show {
            opacity: 1;
            transform: translateY(0);
        }


        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2em;
            }

            .info-value {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Profile</h1>
        
        <div class="info-card">
            <div class="info-label">Name</div>
            <div class="info-value">Sravan Krishna C M</div>
        </div>

        <div class="info-card">
            <div class="info-label">Roll Number</div>
            <div class="info-value">24</div>
        </div>

        <div class="info-card">
            <div class="info-label">Semester</div>
            <div class="info-value">5</div>
        </div>

        <div class="info-card">
            <div class="info-label">CGPA</div>
            <div class="info-value cgpa">7.96</div>
        </div>
    </div>

    <div class="copy-notification">Copied to clipboard!</div>

    <script>
        // Staggered animation on page load
        const cards = document.querySelectorAll('.info-card');
        cards.forEach((card, index) => {
            setTimeout(() => {
                card.classList.add('show');
            }, index * 100);
        });

        // Click to copy functionality
        cards.forEach(card => {
            card.addEventListener('click', function() {
                const value = this.querySelector('.info-value').textContent;
                navigator.clipboard.writeText(value).then(() => {
                    showNotification();
                });
            });
        });

        // Copy notification
        function showNotification() {
            const notification = document.querySelector('.copy-notification');
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
